# CI/CD Pause
#  - À chaque push et pull request : tests (lint, typecheck, audit, contrat OpenAPI, build, tests unitaires,
#    de composants et d'intégration, migrations montée/descente, tests d'attaque), analyse statique du code
#    (Semgrep), build des images Docker + scan de leurs failles (Trivy), vérification du Terraform.
#  - Les actions GitHub sont figées sur un commit (SHA) : un tag déplacé par un pirate ne change rien.
#  - Sur main uniquement, si tout est vert : déploiement sur Google Cloud Run.
# Aucune clé Google n'est stockée dans GitHub : authentification par Workload Identity Federation
# (voir terraform/iam.tf).
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests (typecheck, audit, build, sécurité)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-retries 20
    env:
      # Valeurs de test uniquement (base jetable créée pour ce job)
      DATABASE_URL: postgresql://pause_app:ci-app-pw@localhost:5432/pause
      MIGRATE_DATABASE_URL: postgresql://pause_migrator:ci-migrator-pw@localhost:5432/pause
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      APP_ORIGIN: http://localhost:3000
      UPLOAD_DIR: ${{ github.workspace }}/uploads
      TRUST_PROXY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Dépendances (npm ci, lockfile exact)
        run: npm ci

      - name: Audit des dépendances (pilier 5)
        run: npm run audit

      - name: Lint (ESLint)
        run: npm run lint

      - name: Contrat OpenAPI (Spectral + routes codées = routes documentées)
        run: |
          npm run contract:lint
          npm run contract:check

      - name: Build Next.js
        run: npm run build

      - name: Vérification TypeScript
        run: npm run typecheck

      - name: Tests unitaires et de composants (Vitest, faux Gemini, aucun service externe)
        run: npm test

      - name: Base de test (2 rôles Postgres, migrations, seed)
        env:
          PGHOST: localhost
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
          MIGRATOR_DB_PASSWORD: ci-migrator-pw
          APP_DB_PASSWORD: ci-app-pw
        run: |
          sh db/init.sh
          npm run db:migrate
          # Chaque migration doit pouvoir être annulée : tout descendre, puis tout remonter.
          npm run db:rollback -- --all
          npm run db:migrate

      - name: Tests d'intégration (vraies routes de l'API contre la vraie base)
        run: npm run test:integration

      - name: Données de démo
        run: npm run db:seed

      - name: Démarrer l'app (build de production)
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          mkdir -p "$UPLOAD_DIR"
          NODE_ENV=production PORT=3000 HOSTNAME=127.0.0.1 nohup node .next/standalone/server.js > app.log 2>&1 &
          for _ in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:3000/login && exit 0; sleep 1; done
          cat app.log; exit 1

      - name: Tests d'attaque historiques d'alain
        run: npm run security:test:alain

      - name: Redémarrer l'app (remet à zéro les compteurs anti-brute-force)
        run: |
          pkill -f ".next/standalone/server.js" || true
          sleep 1
          NODE_ENV=production PORT=3000 HOSTNAME=127.0.0.1 nohup node .next/standalone/server.js >> app.log 2>&1 &
          for _ in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:3000/login && exit 0; sleep 1; done
          cat app.log; exit 1

      - name: "Tests d'attaque complets (pilier 10 : JWT, refresh token, IDOR, injections, CSRF, uploads, REST…)"
        run: npm run security:test

      - name: Logs de l'app (en cas d'échec)
        if: failure()
        run: cat app.log || true

  sast:
    name: Analyse statique du code (Semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: semgrep/semgrep:1.142.0 # image officielle, version figée
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Semgrep (règles par défaut + TypeScript + Next.js) — bloque sur tout résultat
        run: semgrep scan --config p/default --config p/typescript --config p/nextjs --metrics=off --error

  docker:
    name: Build des images Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: docker-compose.yml valide
        env:
          POSTGRES_PASSWORD: x
          MIGRATOR_DB_PASSWORD: x
          APP_DB_PASSWORD: x
          JWT_SECRET: x
        run: docker compose config --quiet

      - name: Build app + migrator
        run: |
          docker build --target runner -t pause-app:ci .
          docker build --target migrator -t pause-migrate:ci .

      - name: L'image tourne en non-root (pilier 9)
        run: test "$(docker run --rm --entrypoint id pause-app:ci -u)" != "0"

      - name: Scan des failles de l'image (Trivy, pilier 5) — bloque sur une faille haute ou critique corrigeable
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.67.2 \
            image --quiet --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed pause-app:ci

  terraform:
    name: Terraform (format + validation)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Image officielle, version figée. Pas d'accès à Google ici : on vérifie le code, sans plan ni apply.
      - name: terraform fmt -check, init (sans état), validate
        run: |
          tf() { docker run --rm -v "$PWD/terraform:/tf" -w /tf hashicorp/terraform:1.16.4 "$@"; }
          tf fmt -check -diff
          tf init -backend=false -input=false
          tf validate

  deploy:
    name: Déploiement Google Cloud Run
    needs: [test, sast, docker, terraform]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: production
      url: https://pause-572691549135.europe-west9.run.app
    concurrency:
      group: deploy-production
      cancel-in-progress: false # on ne coupe jamais un déploiement en cours
    permissions:
      contents: read
      id-token: write # jeton OIDC pour Workload Identity Federation
    env:
      PROJECT: pause-demo-3zbux5
      REGION: europe-west9
      IMAGES: europe-west9-docker.pkg.dev/pause-demo-3zbux5/pause
      SITE: https://pause-572691549135.europe-west9.run.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Connexion à Google Cloud (sans clé)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          skip_install: true # gcloud est déjà sur le runner : pas de téléchargement

      - name: Build + envoi des images (app + migrations) dans Artifact Registry
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build --target runner -t "$IMAGES/app:${GITHUB_SHA::7}" .
          docker build --target migrator -t "$IMAGES/migrate:${GITHUB_SHA::7}" .
          docker push "$IMAGES/app:${GITHUB_SHA::7}"
          docker push "$IMAGES/migrate:${GITHUB_SHA::7}"

      - name: Migrations + seed sur Cloud SQL (job Cloud Run, AVANT la nouvelle version)
        # Seule l'image change : compte pause-migrator, secrets et base viennent de terraform/run.tf.
        run: |
          gcloud run jobs update pause-migrate --image "$IMAGES/migrate:${GITHUB_SHA::7}" \
            --region "$REGION" --project "$PROJECT" --quiet --execute-now --wait

      - name: Déploiement de la nouvelle version sur Cloud Run
        # Seule l'image change : variables, secrets, base et photos viennent de terraform/run.tf
        run: gcloud run deploy pause --image "$IMAGES/app:${GITHUB_SHA::7}" --region "$REGION" --project "$PROJECT" --quiet

      - name: Vérifier le site en ligne
        run: |
          for _ in $(seq 1 20); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "$SITE/login")" = "200" ] && break; sleep 3
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' "$SITE/login")" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$SITE/api/v1/me")" = "401"
          curl -sI "$SITE/" | grep -qi '^strict-transport-security'
          echo "✔ $SITE répond (HTTPS, API protégée, HSTS)"
